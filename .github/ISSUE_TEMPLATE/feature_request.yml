name: Feature request
description: Suggest a new skill or an enhancement to an existing skill
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need or use case. Concrete examples help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the skill or feature do? What would someone say to their agent to run it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why this one is better.
    validations:
      required: false
  - type: input
    id: apps
    attributes:
      label: Apps involved (if applicable)
      description: Which apps would the skill read from or write to? (e.g. Slack, Salesforce, Jira)
    validations:
      required: false
